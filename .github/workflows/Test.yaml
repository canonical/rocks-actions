name: Test

on:
  workflow_call:
    inputs:
      build-matrix:
        type: string
        required: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.build-matrix) }}
    uses: canonical/oci-factory/.github/workflows/Test-Rock.yaml@54f70b6be4b7ac01a068e7e873661f0d9b9088aa # main
    with:
      oci-archive-name: ${{ matrix.artifact-name }}
    secrets:
      pro-artifact-passphrase: ${{ secrets[matrix.pro-artifact-passphrase] }}
