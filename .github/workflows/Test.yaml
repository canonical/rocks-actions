name: Test

on:
  workflow_call:
    inputs:
      build-matrix:
        type: string
        required: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.build-matrix) }}
    uses: canonical/oci-factory/.github/workflows/Test-Rock.yaml@79134cb5c65f03bc169e34bc636fad07106cc620 # main
    with:
      oci-archive-name: ${{ matrix.artifact-name }}
    secrets:
      pro-artifact-passphrase: ${{ secrets[matrix.pro-artifact-passphrase] }}
